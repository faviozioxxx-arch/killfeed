name: KillFeed
version: '${version}'
main: dev.killfeed.KillFeedPlugin
api-version: '1.21.11'
description: Красивые панели при убийствах, банах, киках и других действиях
author: you
commands:
  killfeed:
    description: Перезагрузка конфига
    usage: /killfeed reload
    permission: killfeed.admin
permissions:
  killfeed.admin:
    default: op
  killfeed.rank.admin:
    default: false
  killfeed.rank.moder:
    default: false
  killfeed.rank.vip:
    default: false
